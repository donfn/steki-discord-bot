# blastdoor parses strangers' files with libheif, and its packages only change
# when its image is built. Changing the stamp makes Railway rebuild it with the
# current packages. No other service's watch paths include the stamp, so none
# of them restarts for this.
name: Rebuild blastdoor

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a new stamp
        run: |
          date -u +%F > blastdoor/rebuild-stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blastdoor/rebuild-stamp
          git diff --cached --quiet || git commit -m "Rebuild blastdoor for package updates"
          git push
