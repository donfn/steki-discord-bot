# Point the moderation service at this file: Settings > Config-as-code.
[build]
builder = "DOCKERFILE"
dockerfilePath = "cmd/moderation/Dockerfile"
watchPatterns = [
  "cmd/moderation/**",
  "services/moderation/**",
  "go.mod",
  "go.sum",
  "analytics/**",
  "bot/**",
  "brand/**",
  "config/**",
  "dc/**",
  "moderation/**",
  "rpc/**",
  "s3db/**",
  "store/**",
  "tokens/**",
]

[deploy]
healthcheckPath = "/healthz"
# A service stops cleanly when a newer deployment takes its databases over, and
# must not be restarted into its successor's way.
restartPolicyType = "ON_FAILURE"
