# The web service's Railway settings, set on the service itself: Railway no longer
# reads config files. This records them, and a test keeps the watch patterns complete.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "cmd/web/**",
  "services/web/**",
  "internal/verify/**",
  "internal/mcp/**",
  "internal/materials/**",
  "internal/usernotes/**",
  "internal/shield/**",
  "Dockerfile",
  "go.mod",
  "go.sum",
  "internal/analytics/**",
  "internal/bot/**",
  "internal/brand/**",
  "internal/config/**",
  "internal/dc/**",
  "internal/moderation/**",
  "internal/rpc/**",
  "internal/s3db/**",
  "internal/store/**",
  "internal/tokens/**",
]

[deploy]
healthcheckPath = "/healthz"
# A service stops cleanly when a newer deployment takes its databases over, and
# must not be restarted into its successor's way.
restartPolicyType = "ON_FAILURE"
