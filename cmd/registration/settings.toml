# The registration service's Railway settings, set on the service itself: Railway no longer
# reads config files. This records them, and a test keeps the watch patterns complete.
[build]
builder = "DOCKERFILE"
dockerfilePath = "cmd/registration/Dockerfile"
watchPatterns = [
  "cmd/registration/**",
  "services/registration/**",
  "mail/**",
  "go.mod",
  "go.sum",
  "analytics/**",
  "bot/**",
  "brand/**",
  "config/**",
  "dc/**",
  "moderation/**",
  "rpc/**",
  "s3db/**",
  "store/**",
  "tokens/**",
]

[deploy]
healthcheckPath = "/healthz"
# A service stops cleanly when a newer deployment takes its databases over, and
# must not be restarted into its successor's way.
restartPolicyType = "ON_FAILURE"
